name: Murder Mystery browser smoke
on:
  pull_request:
    paths:
      - 'apps/murder-mystery/**'
      - 'mystery-content/**'
      - 'private/**'
      - 'server.js'
      - 'tests/mystery-browser.cjs'
      - '.github/workflows/mystery-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: google-chrome --version
      - run: node tests/mystery-browser.cjs
