name: Murder Mystery browser smoke
on:
  pull_request:
    paths:
      - 'apps/murder-mystery/**'
      - 'mystery-content/**'
      - 'private/**'
      - 'server.js'
      - 'tests/mystery-browser.cjs'
      - '.github/workflows/mystery-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: google-chrome --version
      # Fonts improve screenshots; a package-mirror outage must not skip game tests.
      - name: Install Korean fonts for screenshots (optional)
        continue-on-error: true
        timeout-minutes: 1
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node tests/mystery-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mystery-test-jeju-screens
          path: artifacts/mystery
