name: Terraforming Mars browser smoke
on:
  push:
    paths:
      - 'apps/terraforming-mars/**'
      - 'asset/terraforming-mars/**'
      - 'tests/mars-browser.cjs'
      - '.github/workflows/mars-browser.yml'
  workflow_dispatch:
concurrency:
  group: mars-browser-smoke
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/mars-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mars-browser-screenshot
          path: mars-browser-smoke.png
