name: Security Trace browser puzzles
on:
  pull_request:
    paths:
      - 'apps/security-trace/**'
      - 'index.html'
      - 'server.js'
      - 'tests/security-trace*'
      - '.github/workflows/security-trace.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - name: Install Korean fonts for visual checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: node tests/security-trace-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-browser-screens
          path: trace-browser-artifacts/
          if-no-files-found: ignore
