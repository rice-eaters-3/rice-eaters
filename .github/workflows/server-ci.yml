name: Rice Eaters Node server tests
on:
  push:
    paths:
      - "server.js"
      - "apps/murder-mystery/**"
      - "apps/terraforming-mars/index.html"
      - "tests/server.test.cjs"
      - "package.json"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server.js"
      - "apps/murder-mystery/**"
      - "apps/terraforming-mars/index.html"
      - "tests/server.test.cjs"
      - "package.json"
      - ".github/workflows/server-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
