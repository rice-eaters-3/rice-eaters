name: Live2D runtime and browser
on:
  pull_request:
    paths:
      - 'apps/live2d-studio/**'
      - 'private/live2d/**'
      - 'tests/live2d*'
      - 'server.js'
      - 'index.html'
      - '.github/workflows/live2d-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - name: Install Korean fonts (optional)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: node tests/live2d-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live2d-browser-screens
          path: live2d-browser-artifacts/
          if-no-files-found: ignore
